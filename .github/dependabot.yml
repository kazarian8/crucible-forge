version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    groups:
      security-and-runtime:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@supabase/*"
          - "stripe"
