name: Fix pause transport and compact snap control

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-sequencer-workstation-controls.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch transport and snap UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("components/sound-furnace/StemSequencer.tsx")
          text = path.read_text()
          original = text

          # Pause must follow the real HTMLAudioElement state, not a possibly stale
          # React render. This makes the same transport button reliably pause audio.
          text, pause_count = re.subn(
              r'if \(playing\) \{\n\s*player\.pause\(\);\n\s*setPlaying\(false\);',
              'if (!player.paused) {\n      player.pause();\n      setPlaying(false);',
              text,
              count=1,
          )
          if pause_count != 1 and 'if (!player.paused)' not in text:
              raise SystemExit("pause transport pattern not found")

          # Make Snap an actually small icon-only control. Keep state obvious with
          # the magnet plus an X overlay when disabled; label stays in aria/title.
          snap_pattern = re.compile(
              r'''(?P<indent>\s*)<button\n(?P=indent)  type="button"\n(?P=indent)  aria-pressed=\{snapEnabled\}.*?</button>''',
              re.S,
          )
          matches = list(snap_pattern.finditer(text))
          target = None
          for match in matches:
              block = match.group(0)
              if 'setSnapEnabled' in block and ('Magnet' in block or 'Snap' in block):
                  target = match
                  break
          if target:
              indent = target.group('indent')
              replacement = f'''{indent}<button
{indent}  type="button"
{indent}  aria-pressed={{snapEnabled}}
{indent}  aria-label={{snapEnabled ? `Snap on at ${{snapDivision}}. Tap to turn off.` : "Snap off. Tap to turn on."}}
{indent}  title={{snapEnabled ? `Snap ${{snapDivision}}` : "Snap off"}}
{indent}  onClick={{() => setSnapEnabled((enabled) => !enabled)}}
{indent}  className={{`relative grid size-5 shrink-0 place-items-center rounded ${{snapEnabled ? "bg-orange-400 text-black" : "bg-white/8 text-white/50"}}`}}
{indent}>
{indent}  <Magnet size={{9}} aria-hidden="true" />
{indent}  {{!snapEnabled ? <X className="absolute" size={{10}} strokeWidth={{2.5}} aria-hidden="true" /> : null}}
{indent}</button>'''
              text = text[:target.start()] + replacement + text[target.end():]
          elif 'size-5 shrink-0 place-items-center' not in text:
              raise SystemExit("snap control pattern not found")

          if text == original:
              raise SystemExit("No changes applied")
          path.write_text(text)
          PY

      - name: Verify production build
        run: |
          npm ci
          npm run build

      - name: Commit verified fix
        shell: bash
        run: |
          if git diff --quiet -- components/sound-furnace/StemSequencer.tsx; then
            echo "No sequencer changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/sound-furnace/StemSequencer.tsx
          git commit -m "fix sequencer pause and shrink snap icon"
          git push
