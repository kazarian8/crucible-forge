name: Repair DAW transport pause

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-sequencer-workstation-controls.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Repair play pause transport
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("components/sound-furnace/StemSequencer.tsx")
          text = path.read_text()
          original = text

          start = text.find("  async function togglePreview() {")
          if start < 0:
              raise SystemExit("togglePreview function not found")
          end = text.find("\n  function ", start + 1)
          if end < 0:
              end = text.find("\n  async function ", start + 1)
          if end < 0:
              raise SystemExit("togglePreview function boundary not found")

          block = text[start:end]

          # Pause must use the actual HTMLAudioElement state. React's `playing`
          # state can lag a tap on mobile Safari and caused the transport button
          # to call play again instead of pausing.
          block, count = re.subn(r"if\s*\(playing\)\s*\{", "if (!player.paused) {", block, count=1)
          if count == 0 and "if (!player.paused)" not in block:
              raise SystemExit("pause condition not found inside togglePreview")

          # Keep the playhead at the exact paused position and return immediately,
          # so the same tap cannot fall through into the play path.
          pause_pattern = re.compile(
              r"if \(!player\.paused\) \{(?P<body>.*?)\n\s*\}",
              re.S,
          )
          match = pause_pattern.search(block)
          if not match:
              raise SystemExit("pause branch not found")
          body = match.group("body")
          if "player.pause();" not in body:
              raise SystemExit("pause branch does not pause audio")
          if "return;" not in body:
              body = body.rstrip() + '\n      setPlayheadSeconds(player.currentTime);\n      setStatus("Timeline paused.");\n      return;'
              replacement = "if (!player.paused) {" + body + "\n    }"
              block = block[:match.start()] + replacement + block[match.end():]

          text = text[:start] + block + text[end:]

          # Keep the Loop control anchored to the visible start of the ruler.
          text = text.replace(
              'className={`absolute right-1 top-1 z-20 rounded px-1.5 py-0.5 text-[8px] font-black uppercase ${loopEnabled ? "bg-emerald-400 text-black" : "bg-white/10 text-white/55"}`}',
              'className={`absolute left-1 top-1 z-20 rounded px-1.5 py-0.5 text-[8px] font-black uppercase ${loopEnabled ? "bg-emerald-400 text-black" : "bg-white/10 text-white/55"}`}',
          )

          if text == original:
              raise SystemExit("No transport changes were needed")
          path.write_text(text)
          PY

      - name: Verify production build
        run: |
          npm ci
          npm run build

      - name: Commit verified transport repair
        shell: bash
        run: |
          if git diff --quiet -- components/sound-furnace/StemSequencer.tsx; then
            echo "No sequencer transport changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/sound-furnace/StemSequencer.tsx
          git commit -m "fix DAW play pause transport and loop visibility"
          git push
