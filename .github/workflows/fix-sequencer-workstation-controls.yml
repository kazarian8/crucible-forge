name: Harden DAW timeline playback and controls

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-sequencer-workstation-controls.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply DAW behavior fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("components/sound-furnace/StemSequencer.tsx")
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              text = text.replace(old, new, 1)

          # A DAW transport must never keep playing an obsolete rendered mix.
          # Any edit to the track graph invalidates playback immediately.
          marker = '''  function replaceTrack(id: string, patch: Partial<StemTrack>) {
'''
          if marker not in text:
              raise SystemExit("replaceTrack marker missing")
          if "Timeline edit invalidates the rendered preview" not in text:
              invalidation = '''  // Timeline edit invalidates the rendered preview so playback always matches
  // the clips, mute/solo state, trims, positions, gain and effects currently on screen.
  useEffect(() => {
    const player = previewRef.current;
    if (player) {
      player.pause();
      player.removeAttribute("src");
      try { player.load(); } catch {}
    }
    setPlaying(false);
    setPreviewUrl((current) => {
      if (current) URL.revokeObjectURL(current);
      return "";
    });
  }, [tracks]);

'''
              text = text.replace(marker, invalidation + marker, 1)

          old_snap = '''              <button
                type="button"
                aria-pressed={snapEnabled}
                onClick={() => setSnapEnabled((enabled) => !enabled)}
                className={`flex items-center gap-0.5 rounded-md px-1.5 py-1 text-[8px] font-black uppercase tracking-tight ${snapEnabled ? "bg-orange-400 text-black" : "bg-white/8 text-white/50"}`}
              >
                <span className="relative grid size-[11px] place-items-center" aria-hidden="true">
                  <Magnet size={9} />
                  {!snapEnabled ? (
                    <X className="absolute" size={11} strokeWidth={2.5} />
                  ) : null}
                </span>
                {snapEnabled ? `Snap ${snapDivision}` : "Snap off"}
              </button>
'''
          new_snap = '''              <button
                type="button"
                aria-pressed={snapEnabled}
                aria-label={snapEnabled ? `Snap on at ${snapDivision}. Tap to turn snap off.` : "Snap off. Tap to turn snap on."}
                title={snapEnabled ? `Snap ${snapDivision}` : "Snap off"}
                onClick={() => setSnapEnabled((enabled) => !enabled)}
                className={`relative grid size-6 shrink-0 place-items-center rounded-md ${snapEnabled ? "bg-orange-400 text-black" : "bg-white/8 text-white/50"}`}
              >
                <Magnet size={11} aria-hidden="true" />
                {!snapEnabled ? (
                  <X className="absolute" size={13} strokeWidth={2.5} aria-hidden="true" />
                ) : null}
              </button>
'''
          replace_once(old_snap, new_snap, "compact snap icon")

          # Keep Loop on the visible beginning of the ruler instead of the far-right
          # edge of a horizontally scrollable timeline.
          old_loop_class = '''                    className={`absolute right-1 top-1 z-20 rounded px-1.5 py-0.5 text-[8px] font-black uppercase ${loopEnabled ? "bg-emerald-400 text-black" : "bg-white/10 text-white/55"}`}
'''
          new_loop_class = '''                    className={`absolute left-1 top-1 z-20 rounded px-1.5 py-0.5 text-[8px] font-black uppercase ${loopEnabled ? "bg-emerald-400 text-black" : "bg-white/10 text-white/55"}`}
'''
          replace_once(old_loop_class, new_loop_class, "visible loop control")

          path.write_text(text)
          PY

      - name: Validate production build
        run: |
          npm ci
          npm run build

      - name: Commit verified fixes and retire one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-sequencer-workstation-controls.yml
          git add components/sound-furnace/StemSequencer.tsx
          git commit -m "fix DAW playback state loop visibility and snap control"
          git push
