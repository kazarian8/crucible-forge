name: Patch Crucible sequencer recording

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-sequencer-recording.yml"
      - ".github/scripts/patch_sequencer.py"

permissions:
  contents: write

jobs:
  patch-sequencer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch highlighted-lane recording and project timeline
        run: python3 .github/scripts/patch_sequencer.py

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Commit sequencer update
        shell: bash
        run: |
          if git diff --quiet -- components/sound-furnace/StemSequencer.tsx; then
            echo "No sequencer changes needed."
            exit 0
          fi
          git config user.name "crucible-forge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add components/sound-furnace/StemSequencer.tsx
          git commit -m "Record into highlighted sequencer lane"
          git push origin HEAD:main
