name: Patch Crucible sequencer recording

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-sequencer-recording.yml"

permissions:
  contents: write

jobs:
  patch-sequencer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch highlighted-lane recording and project timeline
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("components/sound-furnace/StemSequencer.tsx")
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              '  const recordingChunksRef = useRef<Blob[]>([]);\n  const clipDragRef = useRef<ClipDrag | null>(null);',
              '  const recordingChunksRef = useRef<Blob[]>([]);\n  const recordingTargetIdRef = useRef("");\n  const recordingStartSecondsRef = useRef(0);\n  const clipDragRef = useRef<ClipDrag | null>(null);',
              'recording refs',
          )

          marker = '  async function startVocalRecording() {\n'
          if text.count(marker) != 1:
              raise SystemExit(f"start recording marker: expected 1 match, found {text.count(marker)}")

          add_lane = '''  async function addVocalLane() {
    if (tracks.length >= MAX_TRACKS) return;
    setError("");
    try {
      const context = new AudioContext();
      const buffer = context.createBuffer(1, Math.max(1, Math.floor(context.sampleRate * 0.05)), context.sampleRate);
      await context.close();
      const laneNumber = tracks.filter((track) => VOCAL_TRACK_PATTERN.test(track.name)).length + 1;
      const start = Math.min(playheadSeconds, rulerDuration);
      const track: StemTrack = {
        id: crypto.randomUUID(),
        name: `Vocal ${laneNumber}`,
        buffer,
        startSeconds: start,
        originalStartSeconds: start,
        trimStartSeconds: 0,
        trimEndSeconds: buffer.duration,
        fadeInSeconds: 0,
        fadeOutSeconds: 0,
        gainDb: 0,
        muted: false,
        solo: false,
        effects: { enabled: false, preset: "clear", intensity: 50, focusNote: projectKey, octave: 3 },
      };
      setTracks((current) => [...current, track]);
      setSelectedTrackId(track.id);
      setCadenceReferenceId((current) => current || track.id);
      setStatus(`${track.name} lane added. It is highlighted and ready to record.`);
    } catch {
      setError("A vocal lane could not be created on this device.");
    }
  }

'''
          text = text.replace(marker, add_lane + marker, 1)

          start = text.index('  async function startVocalRecording() {')
          end = text.index('  function stopVocalRecording() {', start)
          new_recording = '''  async function startVocalRecording() {
    const target = selectedTrack;
    if (!target) {
      setError("Highlight a sequencer lane before recording.");
      setStatus("Choose the lane you want to record onto.");
      return;
    }
    setError("");
    recordingTargetIdRef.current = target.id;
    recordingStartSecondsRef.current = playheadSeconds;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false,
        },
      });
      const preferredType = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"]
        .find((type) => MediaRecorder.isTypeSupported(type));
      const recorder = preferredType
        ? new MediaRecorder(stream, { mimeType: preferredType })
        : new MediaRecorder(stream);
      recorderRef.current = recorder;
      recordingStreamRef.current = stream;
      recordingChunksRef.current = [];
      recorder.ondataavailable = (event) => {
        if (event.data.size > 0) recordingChunksRef.current.push(event.data);
      };
      recorder.onstop = () => {
        const type = recorder.mimeType || preferredType || "audio/webm";
        const blob = new Blob(recordingChunksRef.current, { type });
        const targetId = recordingTargetIdRef.current;
        const recordStart = recordingStartSecondsRef.current;
        stream.getTracks().forEach((track) => track.stop());
        recordingStreamRef.current = null;
        recorderRef.current = null;
        recordingTargetIdRef.current = "";
        setRecording(false);
        setStatus("Recording captured. Loading it onto the highlighted lane…");
        void (async () => {
          try {
            const context = new AudioContext();
            const bytes = await blob.arrayBuffer();
            const buffer = await context.decodeAudioData(bytes.slice(0));
            await context.close();
            const audible = detectAudibleRange(buffer);
            setTracks((current) => current.map((track) => track.id === targetId ? {
              ...track,
              name: VOCAL_TRACK_PATTERN.test(track.name) ? track.name : `Vocal · ${track.name}`,
              buffer,
              startSeconds: recordStart,
              originalStartSeconds: recordStart,
              trimStartSeconds: audible.start,
              trimEndSeconds: audible.end,
              fadeInSeconds: Math.min(0.02, Math.max(0, (audible.end - audible.start) / 2)),
              fadeOutSeconds: Math.min(0.04, Math.max(0, (audible.end - audible.start) / 2)),
            } : track));
            setSelectedTrackId(targetId);
            setCadenceProfiles({});
            setCadenceSuggestions({});
            setStatus("Recorded directly onto the highlighted lane. The vocal waveform is shown in red.");
          } catch {
            setError("The recording was captured but could not be decoded into the lane.");
            setStatus("The selected lane was left unchanged.");
          }
        })();
      };
      recorder.start(250);
      setRecording(true);
      setStatus(`Recording onto ${target.name}…`);
    } catch {
      recordingTargetIdRef.current = "";
      setError("Microphone access is required to record onto the selected lane.");
      setStatus("Recording did not start.");
    }
  }

'''
          text = text[:start] + new_recording + text[end:]

          replace_once(
              '            onClick={recording ? stopVocalRecording : () => void startVocalRecording()}\n            disabled={busy || tracks.length >= MAX_TRACKS}\n            className={`flex items-center gap-2 rounded-xl border px-4 py-2.5 text-xs font-black disabled:opacity-40 ${recording ? "border-red-400/40 bg-red-500/15 text-red-100" : "border-emerald-300/20 bg-emerald-400/[0.06] text-emerald-100"}`}\n          >\n            {recording ? <CircleStop size={15} fill="currentColor" /> : <Mic size={15} />}\n            {recording ? "Stop vocal" : "New vocal track"}',
              '            onClick={() => void addVocalLane()}\n            disabled={busy || tracks.length >= MAX_TRACKS || recording}\n            className="flex items-center gap-2 rounded-xl border border-red-300/20 bg-red-400/[0.06] px-4 py-2.5 text-xs font-black text-red-100 disabled:opacity-40"\n          >\n            <Mic size={15} /> Add vocal lane',
              'top vocal button',
          )

          replace_once(
              '              <p className="font-mono text-sm font-black tabular-nums text-orange-100">{formatTime(playheadSeconds)}</p>',
              '''              <p className="font-mono text-sm font-black tabular-nums text-orange-100">{formatTime(playheadSeconds)}</p>
              <button
                type="button"
                onClick={recording ? stopVocalRecording : () => void startVocalRecording()}
                disabled={busy || !selectedTrack}
                aria-label={recording ? "Stop recording" : `Record onto ${selectedTrack?.name ?? "selected lane"}`}
                className={`flex items-center gap-1.5 rounded-lg px-3 py-2 text-[9px] font-black uppercase tracking-wider disabled:opacity-35 ${recording ? "bg-red-500 text-white" : "border border-red-300/25 bg-red-400/[0.08] text-red-100"}`}
              >
                {recording ? <CircleStop size={13} fill="currentColor" /> : <Mic size={13} />}
                {recording ? "Stop" : "Record"}
              </button>''',
              'timeline record button',
          )

          replacements = {
              'style={{ width: `${Math.round(760 * timelineZoom)}px`, minWidth: "760px" }}': 'style={{ width: `${Math.round(980 * timelineZoom)}px`, minWidth: "980px" }}',
              'className="grid grid-cols-[150px_1fr] border-b border-white/10 bg-[#0d0b0a]"': 'className="grid grid-cols-[170px_1fr] border-b border-white/10 bg-[#0d0b0a]"',
              'left: `calc(150px + (100% - 150px) * ${Math.min(1, playheadSeconds / rulerDuration)})`': 'left: `calc(170px + (100% - 170px) * ${Math.min(1, playheadSeconds / rulerDuration)})`',
              'className={`grid h-[84px] grid-cols-[150px_1fr] border-b border-white/[0.07] last:border-b-0 ${inactive ? "opacity-45" : ""}`}': 'className={`grid h-[96px] grid-cols-[170px_1fr] border-b border-white/[0.07] last:border-b-0 ${inactive ? "opacity-45" : ""}`}',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"timeline sizing replacement not found: {old}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Commit sequencer update
        shell: bash
        run: |
          if git diff --quiet -- components/sound-furnace/StemSequencer.tsx; then
            echo "No sequencer changes needed."
            exit 0
          fi
          git config user.name "crucible-forge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add components/sound-furnace/StemSequencer.tsx
          git commit -m "Record into highlighted sequencer lane"
          git push origin HEAD:main
